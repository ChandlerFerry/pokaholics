<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pokaholics</title>
    <meta
      name="description"
      content="Pokaholics — weeb gamblers, pack chasers, sealed-product problems. Find us on Instagram."
    />
    <meta name="theme-color" content="#0B0B14" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --void: #0b0b14;
        --booth: #141422;
        --panel: #1c1c2e;
        --paper: #f7f4ff;
        --muted: #9a95b3;
        --foil-cyan: #5ce1ff;
        --foil-mag: #ff3d9a;
        --foil-lilac: #b8a4ff;
        --star: #ffe566;
        --ink: #0b0b14;
        --focus: #5ce1ff;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        min-height: 100dvh;
        font-family: "Outfit", system-ui, sans-serif;
        color: var(--paper);
        background: var(--void);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      /* Late-night booth: gradient mesh + soft stars, not casino felt */
      .scene {
        position: relative;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: clamp(1.25rem, 4vw, 2.5rem);
        overflow: hidden;
        background:
          radial-gradient(ellipse 80% 55% at 20% 15%, rgba(255, 61, 154, 0.18), transparent 55%),
          radial-gradient(ellipse 70% 50% at 85% 80%, rgba(92, 225, 255, 0.14), transparent 50%),
          radial-gradient(ellipse 50% 40% at 50% 50%, rgba(184, 164, 255, 0.1), transparent 60%),
          linear-gradient(165deg, #12121f 0%, var(--void) 45%, #080810 100%);
      }

      .scene::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0.55;
        background-image:
          radial-gradient(1px 1px at 12% 22%, rgba(255, 255, 255, 0.7), transparent),
          radial-gradient(1px 1px at 78% 18%, rgba(255, 229, 102, 0.8), transparent),
          radial-gradient(1.5px 1.5px at 64% 72%, rgba(92, 225, 255, 0.7), transparent),
          radial-gradient(1px 1px at 28% 68%, rgba(255, 255, 255, 0.45), transparent),
          radial-gradient(1px 1px at 88% 44%, rgba(255, 61, 154, 0.65), transparent),
          radial-gradient(1.5px 1.5px at 42% 12%, rgba(184, 164, 255, 0.75), transparent),
          radial-gradient(1px 1px at 55% 88%, rgba(255, 255, 255, 0.4), transparent);
      }

      .scene::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 40%, rgba(0, 0, 0, 0.45) 100%);
      }

      .stage {
        position: relative;
        z-index: 1;
        width: min(100%, 26rem);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.35rem;
        text-align: center;
        animation: float-in 0.8s cubic-bezier(0.2, 0.85, 0.25, 1) both;
      }

      @keyframes float-in {
        from {
          opacity: 0;
          transform: translateY(1.1rem) scale(0.97);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      /* Original booster-pack silhouette — not any licensed product */
      .pack {
        position: relative;
        width: min(100%, 15.5rem);
        aspect-ratio: 5 / 7.2;
        border-radius: 0.85rem 0.85rem 1rem 1rem;
        background: linear-gradient(160deg, #2a2440 0%, var(--panel) 40%, #12121c 100%);
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.08),
          0 24px 48px -16px rgba(0, 0, 0, 0.7),
          0 0 40px -8px rgba(255, 61, 154, 0.25);
        overflow: hidden;
        isolation: isolate;
      }

      .pack__foil {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            115deg,
            transparent 20%,
            rgba(92, 225, 255, 0.15) 35%,
            rgba(184, 164, 255, 0.22) 48%,
            rgba(255, 61, 154, 0.18) 58%,
            rgba(255, 229, 102, 0.12) 68%,
            transparent 80%
          );
        background-size: 220% 220%;
        animation: foil-sweep 6s ease-in-out infinite;
        mix-blend-mode: screen;
        pointer-events: none;
      }

      @keyframes foil-sweep {
        0%,
        100% {
          background-position: 0% 40%;
        }
        50% {
          background-position: 100% 60%;
        }
      }

      .pack__seal {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 1.35rem;
        background: linear-gradient(90deg, var(--foil-mag), var(--foil-lilac), var(--foil-cyan));
        opacity: 0.9;
      }

      .pack__seal::after {
        content: "SEALED · ORIGINAL ART";
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 0.55rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        color: var(--ink);
      }

      .pack__body {
        position: relative;
        z-index: 1;
        height: 100%;
        padding: 2.1rem 1.1rem 1.2rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
      }

      .pack__tag {
        margin: 0;
        font-size: 0.65rem;
        font-weight: 700;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .pack__logo {
        margin: 0;
        font-family: "Dela Gothic One", "Outfit", system-ui, sans-serif;
        font-weight: 400;
        font-size: clamp(1.65rem, 7vw, 2rem);
        line-height: 1.05;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }

      .pack__logo .holo {
        display: block;
        background: linear-gradient(
          105deg,
          var(--foil-cyan) 0%,
          var(--foil-lilac) 28%,
          var(--star) 50%,
          var(--foil-mag) 72%,
          var(--foil-cyan) 100%
        );
        background-size: 200% auto;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: holo-text 5s linear infinite;
      }

      @keyframes holo-text {
        to {
          background-position: 200% center;
        }
      }

      .pack__art {
        width: 100%;
        flex: 1;
        margin: 0.75rem 0;
        border-radius: 0.65rem;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background:
          radial-gradient(circle at 30% 25%, rgba(255, 61, 154, 0.35), transparent 45%),
          radial-gradient(circle at 75% 70%, rgba(92, 225, 255, 0.3), transparent 40%),
          radial-gradient(circle at 50% 50%, rgba(184, 164, 255, 0.2), transparent 55%),
          linear-gradient(180deg, #252538 0%, #151520 100%);
        display: grid;
        place-items: center;
        position: relative;
        overflow: hidden;
      }

      /* Abstract "creature spark" — original, not any franchise mascot */
      .spark {
        width: 4.5rem;
        height: 4.5rem;
        position: relative;
      }

      .spark__core {
        position: absolute;
        inset: 22%;
        border-radius: 40% 60% 55% 45% / 50% 40% 60% 50%;
        background: linear-gradient(135deg, var(--foil-mag), var(--foil-lilac) 50%, var(--foil-cyan));
        box-shadow: 0 0 24px rgba(255, 61, 154, 0.45);
        animation: blob 4s ease-in-out infinite;
      }

      .spark__ring {
        position: absolute;
        inset: 8%;
        border-radius: 50%;
        border: 2px dashed rgba(255, 229, 102, 0.55);
        animation: spin 12s linear infinite;
      }

      .spark__star {
        position: absolute;
        top: 6%;
        right: 8%;
        width: 0.65rem;
        height: 0.65rem;
        background: var(--star);
        clip-path: polygon(
          50% 0%,
          61% 35%,
          98% 35%,
          68% 57%,
          79% 91%,
          50% 70%,
          21% 91%,
          32% 57%,
          2% 35%,
          39% 35%
        );
        animation: twinkle 2.2s ease-in-out infinite;
      }

      @keyframes blob {
        0%,
        100% {
          border-radius: 40% 60% 55% 45% / 50% 40% 60% 50%;
          transform: rotate(0deg) scale(1);
        }
        50% {
          border-radius: 55% 45% 40% 60% / 45% 55% 45% 55%;
          transform: rotate(8deg) scale(1.05);
        }
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes twinkle {
        0%,
        100% {
          opacity: 0.55;
          transform: scale(0.9);
        }
        50% {
          opacity: 1;
          transform: scale(1.15);
        }
      }

      .pack__rarity {
        margin: 0;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--star);
      }

      .copy {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.55rem;
        max-width: 22rem;
      }

      .eyebrow {
        margin: 0;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--foil-cyan);
      }

      .title {
        margin: 0;
        font-family: "Dela Gothic One", "Outfit", system-ui, sans-serif;
        font-size: clamp(2.1rem, 9vw, 2.75rem);
        line-height: 1;
        letter-spacing: 0.01em;
        text-transform: uppercase;
      }

      .title .holo {
        background: linear-gradient(
          100deg,
          var(--paper) 0%,
          var(--foil-cyan) 25%,
          var(--foil-lilac) 50%,
          var(--foil-mag) 75%,
          var(--paper) 100%
        );
        background-size: 200% auto;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: holo-text 5s linear infinite;
      }

      .lede {
        margin: 0.2rem 0 0;
        font-size: 1.05rem;
        font-weight: 500;
        line-height: 1.4;
        color: var(--muted);
      }

      .lede strong {
        color: var(--paper);
        font-weight: 600;
      }

      .actions {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.6rem;
        width: 100%;
        margin-top: 0.25rem;
      }

      .ig {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.55rem;
        min-height: 3rem;
        width: min(100%, 18rem);
        padding: 0.75rem 1.4rem;
        border-radius: 999px;
        border: none;
        font-family: inherit;
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        text-decoration: none;
        color: var(--ink);
        background: linear-gradient(105deg, var(--foil-cyan), var(--foil-lilac) 50%, var(--foil-mag));
        background-size: 160% 100%;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.15),
          0 8px 24px -6px rgba(255, 61, 154, 0.45);
        transition:
          transform 0.15s ease,
          background-position 0.25s ease,
          filter 0.15s ease;
        cursor: pointer;
      }

      .ig:hover {
        transform: translateY(-2px);
        background-position: 100% 0;
        filter: brightness(1.06);
      }

      .ig:active {
        transform: translateY(0);
      }

      .ig:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 3px;
      }

      .ig svg {
        width: 1.15rem;
        height: 1.15rem;
        flex-shrink: 0;
      }

      .ig[aria-disabled="true"] {
        background: var(--panel);
        color: var(--muted);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08);
        cursor: default;
        filter: none;
        transform: none;
      }

      .ig[aria-disabled="true"]:hover {
        transform: none;
        filter: none;
        background-position: 0 0;
      }

      .footnote {
        margin: 0;
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.4rem;
        margin-top: 0.15rem;
      }

      .tag {
        margin: 0;
        padding: 0.28rem 0.65rem;
        border-radius: 999px;
        font-size: 0.68rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      @media (prefers-reduced-motion: reduce) {
        .stage,
        .pack__foil,
        .pack__logo .holo,
        .title .holo,
        .spark__core,
        .spark__ring,
        .spark__star {
          animation: none;
        }

        .pack__logo .holo,
        .title .holo {
          background-position: 40% center;
        }

        .ig {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="scene">
      <div class="stage">
        <div class="pack" aria-hidden="true">
          <div class="pack__foil"></div>
          <div class="pack__seal"></div>
          <div class="pack__body">
            <p class="pack__tag">Booster · Fan brand</p>
            <p class="pack__logo">
              <span class="holo">Poka<br />holics</span>
            </p>
            <div class="pack__art">
              <div class="spark">
                <div class="spark__ring"></div>
                <div class="spark__core"></div>
                <div class="spark__star"></div>
              </div>
            </div>
            <p class="pack__rarity">★★★ Chase energy</p>
          </div>
        </div>

        <div class="copy">
          <p class="eyebrow">Pack gamblers only</p>
          <h1 class="title"><span class="holo">Pokaholics</span></h1>
          <p class="lede">
            Weebs with a <strong>sealed-product problem</strong>.
            For the chase — not the investment.
            <em>(Okay, a little the investment.)</em>
          </p>
          <div class="tags" aria-hidden="true">
            <p class="tag">holo hunt</p>
            <p class="tag">late-night rips</p>
            <p class="tag">grail brain</p>
          </div>
        </div>

        <div class="actions">
          <a
            id="ig-link"
            class="ig"
            href="#"
            aria-disabled="true"
            rel="noopener noreferrer"
          >
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect
                x="3.5"
                y="3.5"
                width="17"
                height="17"
                rx="5"
                stroke="currentColor"
                stroke-width="1.75"
              />
              <circle
                cx="12"
                cy="12"
                r="4"
                stroke="currentColor"
                stroke-width="1.75"
              />
              <circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" />
            </svg>
            <span id="ig-label">Instagram — soon</span>
          </a>
          <p class="footnote" id="ig-note">Handle coming next</p>
        </div>
      </div>
    </main>

    <script>
      // Set your Instagram handle when ready (no @). Leave empty until then.
      const INSTAGRAM_HANDLE = "";

      (function wireInstagram() {
        const link = document.getElementById("ig-link");
        const label = document.getElementById("ig-label");
        const note = document.getElementById("ig-note");
        const handle = (INSTAGRAM_HANDLE || "").trim().replace(/^@/, "");

        if (!handle) {
          link.setAttribute("aria-disabled", "true");
          link.setAttribute("role", "link");
          link.removeAttribute("target");
          link.href = "#";
          link.addEventListener("click", (e) => e.preventDefault());
          label.textContent = "Instagram — soon";
          note.textContent = "Handle coming next";
          return;
        }

        link.href =
          "https://www.instagram.com/" + encodeURIComponent(handle) + "/";
        link.target = "_blank";
        link.removeAttribute("aria-disabled");
        link.removeAttribute("role");
        label.textContent = "Follow on Instagram";
        note.textContent = "@" + handle;
      })();
    </script>
  </body>
</html>
