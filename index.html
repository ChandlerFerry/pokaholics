<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pokaholics</title>
    <meta
      name="description"
      content="Pokaholics — the table is set. Find us on Instagram."
    />
    <meta name="theme-color" content="#041F1A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --felt-void: #041f1a;
        --felt-lift: #0a322a;
        --felt-edge: #163f35;
        --card-stock: #ede6d9;
        --card-shadow: #cfc6b4;
        --ink: #0c0b0a;
        --ink-soft: #3d3832;
        --chip-coral: #e85d4c;
        --chip-coral-deep: #c44738;
        --sage: #8fa89f;
        --focus: #f0c14b;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        min-height: 100dvh;
        font-family: "Newsreader", Georgia, "Times New Roman", serif;
        color: var(--ink);
        background: var(--felt-void);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      /* Felt table — grain + vignette, no stock casino gradient */
      .felt {
        position: relative;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: clamp(1.25rem, 4vw, 2.5rem);
        overflow: hidden;
        background:
          radial-gradient(
            120% 90% at 50% 40%,
            var(--felt-lift) 0%,
            var(--felt-void) 62%,
            #021410 100%
          );
      }

      .felt::before {
        content: "";
        position: absolute;
        inset: 0;
        opacity: 0.35;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        mix-blend-mode: soft-light;
      }

      /* Rail / table edge */
      .felt::after {
        content: "";
        position: absolute;
        inset: clamp(0.65rem, 2vw, 1.1rem);
        border: 1px solid color-mix(in srgb, var(--felt-edge) 70%, transparent);
        border-radius: 1.25rem;
        box-shadow:
          inset 0 0 0 1px color-mix(in srgb, #ffffff 4%, transparent),
          inset 0 0 60px color-mix(in srgb, #000 35%, transparent);
        pointer-events: none;
      }

      .card {
        position: relative;
        z-index: 1;
        width: min(100%, 28rem);
        aspect-ratio: 5 / 7;
        max-height: min(88dvh, 40rem);
        padding: clamp(1.35rem, 4vw, 1.85rem);
        background:
          linear-gradient(
            165deg,
            #f4efe6 0%,
            var(--card-stock) 48%,
            #e4dccb 100%
          );
        border-radius: 1.15rem;
        box-shadow:
          0 1px 0 color-mix(in srgb, #fff 55%, transparent),
          0 28px 50px -18px rgba(0, 0, 0, 0.55),
          0 10px 18px -10px rgba(0, 0, 0, 0.4),
          0 0 0 1px color-mix(in srgb, var(--card-shadow) 80%, transparent);
        display: grid;
        grid-template-rows: auto 1fr auto;
        animation: deal-in 0.85s cubic-bezier(0.2, 0.85, 0.25, 1) both;
      }

      @keyframes deal-in {
        from {
          opacity: 0;
          transform: translateY(1.25rem) rotate(-2.5deg) scale(0.97);
        }
        to {
          opacity: 1;
          transform: translateY(0) rotate(0deg) scale(1);
        }
      }

      .corner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.1rem;
        font-family: "Bricolage Grotesque", system-ui, sans-serif;
        font-weight: 700;
        font-size: 1.05rem;
        line-height: 1;
        letter-spacing: -0.02em;
        color: var(--ink);
        user-select: none;
      }

      .corner .suit {
        font-size: 1.15rem;
        color: var(--chip-coral);
        line-height: 1;
      }

      .corner--tl {
        justify-self: start;
      }

      .corner--br {
        justify-self: end;
        transform: rotate(180deg);
      }

      .face {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0.5rem 0.75rem 1rem;
        gap: 0.85rem;
      }

      .eyebrow {
        margin: 0;
        font-family: "Bricolage Grotesque", system-ui, sans-serif;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--ink-soft);
      }

      .mark {
        margin: 0;
        font-family: "Bricolage Grotesque", system-ui, sans-serif;
        font-weight: 800;
        font-size: clamp(2.4rem, 9vw, 3.35rem);
        line-height: 0.92;
        letter-spacing: -0.04em;
        color: var(--ink);
      }

      .mark span {
        display: block;
      }

      .lede {
        margin: 0.15rem 0 0;
        max-width: 18ch;
        font-size: clamp(1.05rem, 2.8vw, 1.2rem);
        font-weight: 400;
        font-style: italic;
        line-height: 1.35;
        color: var(--ink-soft);
      }

      .chip {
        --chip-size: 4.5rem;
        width: var(--chip-size);
        height: var(--chip-size);
        border-radius: 50%;
        margin: 0.35rem 0 0.15rem;
        background:
          radial-gradient(
            circle at 35% 30%,
            color-mix(in srgb, #fff 22%, var(--chip-coral)) 0%,
            var(--chip-coral) 42%,
            var(--chip-coral-deep) 100%
          );
        box-shadow:
          0 1px 0 color-mix(in srgb, #fff 35%, transparent),
          0 6px 14px -4px rgba(196, 71, 56, 0.55),
          inset 0 0 0 0.45rem var(--card-stock),
          inset 0 0 0 0.58rem var(--chip-coral-deep);
        position: relative;
        flex-shrink: 0;
      }

      .chip::before {
        content: "";
        position: absolute;
        inset: 0.72rem;
        border-radius: 50%;
        border: 1.5px dashed color-mix(in srgb, #fff 45%, transparent);
        opacity: 0.85;
      }

      .chip::after {
        content: "PH";
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-family: "Bricolage Grotesque", system-ui, sans-serif;
        font-weight: 800;
        font-size: 0.95rem;
        letter-spacing: 0.06em;
        color: var(--card-stock);
      }

      .actions {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.65rem;
        padding-bottom: 0.15rem;
      }

      .ig {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.55rem;
        min-height: 2.85rem;
        padding: 0.7rem 1.35rem;
        border-radius: 999px;
        border: none;
        font-family: "Bricolage Grotesque", system-ui, sans-serif;
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: 0.01em;
        text-decoration: none;
        color: var(--card-stock);
        background: var(--ink);
        box-shadow: 0 2px 0 #000;
        transition:
          transform 0.15s ease,
          background 0.15s ease,
          box-shadow 0.15s ease;
        cursor: pointer;
      }

      .ig svg {
        width: 1.1rem;
        height: 1.1rem;
        flex-shrink: 0;
      }

      .ig:hover {
        background: #1a1816;
        transform: translateY(-1px);
        box-shadow: 0 3px 0 #000;
      }

      .ig:active {
        transform: translateY(1px);
        box-shadow: 0 1px 0 #000;
      }

      .ig:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 3px;
      }

      .ig[aria-disabled="true"] {
        background: color-mix(in srgb, var(--ink) 72%, var(--card-stock));
        box-shadow: none;
        cursor: default;
        transform: none;
      }

      .ig[aria-disabled="true"]:hover {
        background: color-mix(in srgb, var(--ink) 72%, var(--card-stock));
        transform: none;
        box-shadow: none;
      }

      .footnote {
        margin: 0;
        font-family: "Bricolage Grotesque", system-ui, sans-serif;
        font-size: 0.68rem;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--sage);
        text-align: center;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (max-height: 640px) {
        .card {
          aspect-ratio: auto;
          min-height: auto;
          max-height: none;
        }

        .chip {
          --chip-size: 3.5rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .card {
          animation: none;
        }

        .ig {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="felt">
      <article class="card" aria-labelledby="brand">
        <div class="corner corner--tl" aria-hidden="true">
          <span>PH</span>
          <span class="suit">♥</span>
        </div>

        <div class="face">
          <p class="eyebrow">Still shuffling</p>
          <h1 id="brand" class="mark">
            <span>Poka</span>
            <span>holics</span>
          </h1>
          <div class="chip" aria-hidden="true"></div>
          <p class="lede">The table is set. We&rsquo;re dealing the rest.</p>
        </div>

        <div class="actions">
          <a
            id="ig-link"
            class="ig"
            href="#"
            aria-disabled="true"
            rel="noopener noreferrer"
          >
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect
                x="3.5"
                y="3.5"
                width="17"
                height="17"
                rx="5"
                stroke="currentColor"
                stroke-width="1.75"
              />
              <circle
                cx="12"
                cy="12"
                r="4"
                stroke="currentColor"
                stroke-width="1.75"
              />
              <circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" />
            </svg>
            <span id="ig-label">Instagram — soon</span>
          </a>
          <p class="footnote" id="ig-note">Handle coming next</p>
        </div>

        <div class="corner corner--br" aria-hidden="true">
          <span>PH</span>
          <span class="suit">♥</span>
        </div>
      </article>
    </main>

    <script>
      // Set your Instagram handle when ready (no @). Leave empty until then.
      const INSTAGRAM_HANDLE = "";

      (function wireInstagram() {
        const link = document.getElementById("ig-link");
        const label = document.getElementById("ig-label");
        const note = document.getElementById("ig-note");
        const handle = (INSTAGRAM_HANDLE || "").trim().replace(/^@/, "");

        if (!handle) {
          link.setAttribute("aria-disabled", "true");
          link.setAttribute("role", "link");
          link.removeAttribute("target");
          link.href = "#";
          link.addEventListener("click", (e) => e.preventDefault());
          label.textContent = "Instagram — soon";
          note.textContent = "Handle coming next";
          return;
        }

        link.href = "https://www.instagram.com/" + encodeURIComponent(handle) + "/";
        link.target = "_blank";
        link.removeAttribute("aria-disabled");
        link.removeAttribute("role");
        label.textContent = "Follow on Instagram";
        note.textContent = "@" + handle;
      })();
    </script>
  </body>
</html>
